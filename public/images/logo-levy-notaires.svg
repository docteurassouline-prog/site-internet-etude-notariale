<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lévy Notaires Paris">
  <!-- Anneau doré épais -->
  <circle cx="50" cy="50" r="48" fill="#A98A4C"/>
  <!-- Disque bleu marine -->
  <circle cx="50" cy="50" r="44" fill="#101C2C"/>
  <!-- L biseauté — jambe diagonale, face claire -->
  <polygon points="53,17 60,19 34,74 29,73" fill="#C4A463"/>
  <!-- L biseauté — jambe diagonale, face sombre -->
  <polygon points="48,16 53,17 29,73 24,72" fill="#A2833F"/>
  <!-- L biseauté — pied horizontal, face claire -->
  <polygon points="29,73 76,73 76,78 24,78" fill="#C4A463"/>
  <!-- L biseauté — pied horizontal, face sombre -->
  <polygon points="24,78 76,78 76,82 20,82" fill="#A2833F"/>
</svg>
