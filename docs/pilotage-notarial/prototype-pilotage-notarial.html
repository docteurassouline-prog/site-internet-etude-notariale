function barChart(data, unit){
  const W=460, H=195, pad={l:36,r:10,t:16,b:46};
  const max = Math.max(...data.map(d=>d.c), 1);
  const bw = 26, iw = (W-pad.l-pad.r)/data.length;
  const ticks = [0, Math.ceil(max/2), max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Répartition" style="max-width:100%;height:auto">`;
  ticks.forEach(t=>{ const y = pad.t + (H-pad.t-pad.b)*(1-t/max);
    s += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="#e8e4d8" stroke-width="1"/><text x="${pad.l-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#83868e" font-family="Public Sans">${t}</text>`;});
  data.forEach((d,i)=>{
    const h = (H-pad.t-pad.b)*(d.c/max), x = pad.l + i*iw + (iw-bw)/2, y = H-pad.b-h;
    s += `<path d="M${x} ${H-pad.b} v${-(Math.max(h-4,0))} q0 -4 4 -4 h${bw-8} q4 0 4 4 v${Math.max(h-4,0)} z" fill="#2a78d6" data-tip="${esc(d.n)} : ${d.c}${unit?' '+unit:''}"/>`;
    s += `<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1d24" font-family="Public Sans">${d.c}</text>`;
    const words = d.n.split(' ');
    const l1 = words.slice(0, words.length>2?2:1).join(' '), l2 = words.slice(words.length>2?2:1).join(' ');
    s += `<text x="${x+bw/2}" y="${H-pad.b+14}" text-anchor="middle" font-size="9.5" fill="#4b5058" font-family="Public Sans">${esc(l1)}</text>`;
    if(l2) s += `<text x="${x+bw/2}" y="${H-pad.b+25}" text-anchor="middle" font-size="9.5" fill="#4b5058" font-family="Public Sans">${esc(l2)}</text>`;
  });
  s += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${H-pad.b}" y2="${H-pad.b}" stroke="#c3beae" stroke-width="1"/></svg>`;
  return s;
}
function hbarChart(data){
  const W=460, rh=30, pad={l:100,r:46,t:6,b:6};
  const H = pad.t+pad.b+data.length*rh;
  const max = Math.max(...data.map(d=>d.c),1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dossiers actifs par collaborateur" style="max-width:100%;height:auto">`;
  data.forEach((d,i)=>{
    const y = pad.t+i*rh, w = (W-pad.l-pad.r)*(d.c/max), bh=18;
    s += `<text x="${pad.l-8}" y="${y+bh/2+4}" text-anchor="end" font-size="11" fill="#4b5058" font-family="Public Sans">${esc(d.n)}</text>`;
    s += `<path d="M${pad.l} ${y} h${Math.max(w-4,0)} q4 0 4 4 v${bh-8} q0 4 -4 4 h${-Math.max(w-4,0)} z" fill="#2a78d6" data-tip="${esc(d.n)} : ${d.c} dossiers actifs"/>`;
    s += `<text x="${pad.l+w+7}" y="${y+bh/2+4}" font-size="11" font-weight="600" fill="#1a1d24" font-family="Public Sans">${d.c}</text>`;
  });
  s += `<line x1="${pad.l}" x2="${pad.l}" y1="${pad.t}" y2="${H-pad.b}" stroke="#c3beae" stroke-width="1"/></svg>`;
  return s;
}

function friseSVG(steps, etat){
  const n = steps.length, W = Math.max(760, (n-1)*112 + 144), H = 118, y = 46;
  const gap = (W-144)/(n-1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frise chronologique du dossier" style="min-width:${W}px;height:auto;display:block">`;
  s += `<line x1="72" x2="${W-72}" y1="${y}" y2="${y}" stroke="#e0dccc" stroke-width="3"/>`;
  const doneN = steps.filter(st=>etat>st.e).length;
  if(doneN>0) s += `<line x1="72" x2="${72+gap*Math.min(doneN,n-1)}" y1="${y}" y2="${y}" stroke="#0e1a33" stroke-width="3"/>`;
  steps.forEach((st,i)=>{
    const x = 72+gap*i;
    const fait = etat>st.e, cur = !fait && (i===0 || etat>steps[i-1].e);
    if(cur) s += `<circle cx="${x}" cy="${y}" r="12" fill="#f4edda" stroke="#c9a35f" stroke-width="2.5"/>`;
    s += `<circle cx="${x}" cy="${y}" r="${cur?6:7}" fill="${fait?'#0e1a33':(cur?'#a97e3f':'#fff')}" stroke="${fait?'#0e1a33':(cur?'#a97e3f':'#b9b3a0')}" stroke-width="2"/>`;
    if(fait) s += `<text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="8.5" fill="#fff" font-family="Public Sans">✓</text>`;
    s += `<text x="${x}" y="${y-24}" text-anchor="middle" font-size="10" fill="${st.ia?'#8a6428':'#4b5058'}" font-family="Public Sans" font-weight="700">${st.ia?'🤖 IA':'👤'}</text>`;
    const words = st.t.split(' ');
    const mid = Math.ceil(words.length/2);
    const l1 = words.slice(0,mid).join(' '), l2 = words.slice(mid).join(' ');
    s += `<text x="${x}" y="${y+26}" text-anchor="middle" font-size="10" font-weight="${cur?'700':'500'}" fill="${cur?'#1a1d24':'#4b5058'}" font-family="Public Sans">${esc(l1)}</text>`;
    if(l2) s += `<text x="${x}" y="${y+38}" text-anchor="middle" font-size="10" font-weight="${cur?'700':'500'}" fill="${cur?'#1a1d24':'#4b5058'}" font-family="Public Sans">${esc(l2)}</text>`;
    s += `<text x="${x}" y="${y+54}" text-anchor="middle" font-size="9" fill="#9a958a" font-family="Public Sans">${fait?'fait':(cur?'en cours':'à venir')}</text>`;
  });
  s += `</svg>`;
  return `<div class="frise-wrap">${s}</div>`;
}

    audit('Scénario de relance suspendu : '+s.c, $DEMOREF); toast('<b>Scénario suspendu</b><br>'+esc(s.c)); render();
  }));
  document.querySelectorAll('[data-reprend]').forEach(el=>el.addEventListener('click', ()=>{
    const s = DEMO.scenarios[+el.dataset.reprend]; s.st = 'Actif'; s.next='prochaine relance planifiée';
    audit('Scénario de relance réactivé : '+s.c, $DEMOREF); toast('<b>Scénario réactivé</b><br>'+esc(s.c)); render();
  }));
  document.querySelectorAll('[data-valext]').forEach(el=>el.addEventListener('click', ()=>{
    const [id,i] = el.dataset.valext.split(':'); const doc = DEMO.docs.find(d=>d.id===id); const ex = doc.ext[+i];
    ex.stv = 'validée'; audit('Donnée validée : « '+ex.f+' = '+ex.v+' » ('+doc.n+', '+ex.src+')', $DEMOREF);
    toast('<b>Donnée validée</b><br>'+esc(ex.f)+' — validation nominative inscrite au journal.'); render();
  }));
  document.querySelectorAll('input[name="adr"]').forEach(el=>el.addEventListener('change', ()=>{ state.arbitrageChoix = el.value; }));
  document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click', ()=>act(el.dataset.act, el)));
  attachTips();
}
function act(a, el){
  if(a==='assist-close'){ state.assistOpen=false; render(); return; }
  if(a==='assist-send'){ const v=$('#chatin').value.trim(); if(v) askAssist(v); return; }
  if(a==='versions'){ $('#verspanel').classList.toggle('hidden'); audit('Comparaison des versions v1 → v2 du projet', $DEMOREF); return; }
  if(a==='demander-visa'){
    if(DEMO.acte.blocages.length){ toast('<b>Contrôles restants</b><br>Levez les contrôles obligatoires avant la demande de visa.'); return; }
    DEMO.acte.visaDemande = true;
    VALIDATIONS.push({id:"V4", t:"Apposer le visa juridique — vente FABIANI / BELKACEM", d:"Contrôles obligatoires terminés (adresse arbitrée, offre de prêt et PV d'AG rattachés). Rapport de cohérence prêt.", ref:"VTE-2026-0142", type:"visa"});
    audit("DEMANDE DE VISA envoyée à Me T. Lévy — projet d'acte v2 (contrôles obligatoires terminés)", $DEMOREF);
    toast("<b>Demande de visa envoyée</b><br>Le projet v2 est dans la file « À traiter » de Me Lévy.");
    render(); return;
  }
  if(a==='toggle-queue'){ state.queueAll=!state.queueAll; render(); return; }
  if(a==='toggle-manu'){ state.manuOpen=!state.manuOpen; state.complOpen=false; render(); return; }
  if(a==='toggle-compl'){ state.complOpen=!state.complOpen; state.manuOpen=false; render(); return; }
  if(a==='creer-dossier'){
    const type = $('#m-type').value, parties = $('#m-parties').value.trim()||'Parties à préciser', note = $('#m-note').value.trim();
    const MAP = {"Vente immobilière":["Immobilier","Immobilier résidentiel",20,9500],"Acquisition":["Immobilier","Immobilier résidentiel",17,9000],"VEFA":["Immobilier","VEFA",30,22000],"Succession":["Patrimoine et famille","Successions",55,14000],"Succession internationale":["International","Successions internationales",62,19000],"Donation":["Patrimoine et famille","Donations",10,6000],"Partage":["Patrimoine et famille","Partage",32,9500],"Divorce — liquidation":["Patrimoine et famille","Divorce",36,10200],"Constitution de SCI":["Patrimoine et famille","SCI",9,3900],"Structuration patrimoniale":["Patrimoine et famille","Structuration patrimoniale",14,8500],"Transmission d'entreprise":["Entreprise","Transmission d'entreprise",40,18000],"Bail commercial":["Entreprise","Baux commerciaux",10,4300],"Contrat de mariage — expatriés":["International","Expatriés",7,2900]};
    const m = MAP[type]||["Immobilier","Immobilier résidentiel",20,9000];
    const ref = "MAN-2026-0"+(150+DOSSIERS.filter(d=>d.ref.startsWith('MAN')).length);
    DOSSIERS.push({ref, type, them:m[0], exp:m[1], heures:m[2], etat:4, parties, resp:"Me H. Rouaud", risque:"faible", urg:"normal", inact:0, ca:m[3], alerte:{n:"ok", c:""}});
    audit('Dossier créé manuellement : '+ref+' — '+type+(note?' · note : '+note:''), ref);
    toast('<b>Dossier '+ref+' créé</b><br>Checklist « '+esc(type)+' » générée, équipe assignée. L\'IA prend le relais.');
    state.manuOpen=false; go('dossiers'); return;
  }
  if(a==='completer'){
    const ref = ($('#c-ref').value||'').split(' — ')[0], note = $('#c-note').value.trim();
    if(!note){ toast('<b>Précisez l\'élément à ajouter</b>'); return; }
    audit('Complément ajouté manuellement : '+note, ref);
    toast('<b>Ajouté au dossier '+esc(ref)+'</b><br>'+esc(note)+' — l\'IA reclassera la pièce et mettra la checklist à jour.');
    state.complOpen=false; render(); return;
  }
  if(a==='soumettre-adresse'){
    if(!state.arbitrageChoix){ toast('<b>Choisissez une option</b><br>Sélectionnez une proposition avant de transmettre.'); return; }
    audit('Anomalie A-2 transmise au notaire avec proposition : option « '+state.arbitrageChoix+' »', $DEMOREF);
    toast('<b>Transmis au notaire</b><br>L\'arbitrage apparaît dans la file de Me Lévy. Passez « Voir comme : Me Lévy » pour trancher.');
    return;
  }
  if(a==='trancher-adresse'){
    if(!state.arbitrageChoix){ toast('<b>Choisissez une option</b><br>Sélectionnez la solution retenue avant de trancher.'); return; }
    const lib = {['24']:'n° 24 retenu (cadastre + taxe foncière), mention explicative à l\'acte', ['22']:'n° 22 du titre retenu', piece:'justificatif complémentaire demandé avant décision'}[state.arbitrageChoix];
    const an = DEMO.anomalies.find(x=>x.id==='A-2'); an.resolue = 'décision de Me Lévy — '+lib;
    if(state.arbitrageChoix!=='piece'){ DEMO.acte.blocages = DEMO.acte.blocages.filter(b=>!b.includes('A-2'));
      const v = DEMO.acte.vars.find(v=>v.n.includes('adresse')); v.ok=true; v.v = (state.arbitrageChoix==='24'?'24':'22')+' rue de la Tour, 75116 Paris'; v.src='Décision du notaire du 22/08 + cadastre CD 87'; }
    VALIDATIONS = VALIDATIONS.filter(v=>v.id!=='V2');
    audit('DÉCISION DU NOTAIRE — arbitrage A-2 : '+lib, $DEMOREF);
    toast('<b>Décision enregistrée</b><br>'+esc(lib)+'. Journal mis à jour, blocage de l\'acte levé le cas échéant.');
    render(); return;
  }
  if(a==='valider-taxe'){
    audit('TAXATION VALIDÉE — 87 105 € (contrôle des écarts : aucun)', $DEMOREF);
    toast('<b>Taxation validée</b><br>États de clôture préparés. Validation nominative inscrite au journal.');
    return;
  }
  if(a==='rappro'){
    audit('Rapprochement validé — prix de vente 640 000 €', 'VTE-2026-0119');
    toast('<b>Rapprochement effectué</b><br>Relevé du 21/08 pointé — solde du dossier à jour.');
    return;
  }
  if(a==='depot-client'){
    toast('<b>Dépôt simulé</b><br>Dans le produit : capture photo, contrôle de lisibilité immédiat, analyse, et suspension automatique de la relance.');
    audit('Portail — dépôt de pièce simulé par le client (démonstration)', $DEMOREF);
    return;
  }
  if(a==='msg-client'){ toast('<b>Messagerie sécurisée</b><br>Fil de discussion chiffré côté produit — la réponse arriverait dans l\'onglet Relances de l\'étude.'); return; }
  if(a==='rdv-client'){ toast('<b>Prise de rendez-vous</b><br>Le produit proposera les créneaux de l\'étude synchronisés avec l\'agenda — indisponible dans le prototype.'); return; }
}
function attachTips(){
  const tip = $('#viztip');
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mousemove', e=>{ tip.style.display='block'; tip.textContent = el.dataset.tip; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY-10)+'px'; });
    el.addEventListener('mouseleave', ()=>{ tip.style.display='none'; });
  });
}
/* ---------- Recherche globale ---------- */
function buildIndex(){
  return [
   ...DOSSIERS.map(d=>({t:d.ref+' — '+d.parties, s:d.type+' · '+ETATS[d.etat-1], go:()=>go('dossier',{dossierRef:d.ref, dossierTab:'ia'})})),
   {t:'Serge Fabiani', s:'Vendeur — VTE-2026-0142 · CNI expirée', go:()=>go('dossier',{dossierRef:$DEMOREF,dossierTab:'synthese'})},
   {t:'Inès Belkacem', s:'Acquéreur — VTE-2026-0142 · prêt Banque Héliade', go:()=>go('dossier',{dossierRef:$DEMOREF,dossierTab:'synthese'})},
   {t:'24 rue de la Tour', s:'Bien — VTE-2026-0142 (adresse en arbitrage)', go:()=>go('dossier',{dossierRef:$DEMOREF,dossierTab:'anomalies'})},
   {t:"PV d'AG 2025", s:'Pièce reçue ce matin — rattachement à approuver (Entrées)', go:()=>go('entrees')},
   {t:'Condition suspensive de prêt', s:'Offre reçue — levée à approuver', go:()=>go('entrees')}
  ];
}
$('#gs').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase(); const res = $('#gsres');
  if(q.length<2){ res.classList.add('hidden'); return; }
  const hits = buildIndex().filter(x=>(x.t+' '+x.s).toLowerCase().includes(q)).slice(0,8);
  res.innerHTML = hits.map((h,i)=>`<button data-gs="${i}"><div class="t">${esc(h.t)}</div><div class="s">${esc(h.s)}</div></button>`).join('') || '<button disabled><div class="s">Aucun résultat dans les données fictives</div></button>';
  res.classList.remove('hidden');
  res.querySelectorAll('[data-gs]').forEach(b=>b.addEventListener('click', ()=>{ hits[+b.dataset.gs].go(); res.classList.add('hidden'); $('#gs').value=''; }));
});
document.addEventListener('click', e=>{ if(!e.target.closest('.gsearch')) $('#gsres').classList.add('hidden'); });
document.addEventListener('keydown', e=>{
  if(e.key==='/' && !e.target.matches('input,textarea')){ e.preventDefault(); $('#gs').focus(); }
});
/* ---------- Rôle & init ---------- */
$('#role').addEventListener('change', e=>{
  state.role = e.target.value; $('#uav').textContent = ROLES[state.role].av;
  audit('Changement de vue — connexion en tant que '+ROLES[state.role].nom+' (simulation)', '—');
  toast('<b>Vue « '+ROLES[state.role].titre+' »</b><br>Tableau de bord et permissions adaptés.');
  go('dashboard');
});
$('#fab').addEventListener('click', ()=>{ state.assistOpen = true; render(); });
render();
</script>
