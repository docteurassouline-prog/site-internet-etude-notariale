<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lévy Notaires — Paris">
  <!--
    Favicon repris de la marque de l'étude le 7 septembre 2026 : cercle et
    « L » biseauté, à l'identique de public/images/logo-levy-notaires.svg,
    posés sur le fond night du site. La composition provisoire précédente
    (filet doré et lettre L en Georgia) n'avait aucun rapport avec l'enseigne.
    Comme le logo lui-même, ce tracé est une reconstitution : il suivra le
    fichier vectoriel de la charte lorsqu'il sera fourni.
  -->
  <rect width="64" height="64" fill="#101C2C"/>
  <g transform="translate(32 32) scale(0.56) translate(-50 -50)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#A98A4C" stroke-width="2.4"/>
    <polygon points="51,6 58,7 30,72 25,72" fill="#C4A463"/>
    <polygon points="46,6 51,6 25,72 20,72" fill="#A2833F"/>
    <polygon points="30,72 86,72 86,75.5 24,75.5" fill="#C4A463"/>
    <polygon points="24,75.5 86,75.5 86,79 20,79" fill="#A2833F"/>
  </g>
</svg>
