<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lévy Notaires — Paris">
  <!--
    Favicon repris de la marque de l'étude : cercle et « L » biseauté, à
    l'identique de public/images/logo-levy-notaires.svg, posés sur le fond
    night du site. Tracé remis à jour le 8 septembre 2026 en même temps que
    le logo, d'après l'enseigne de la salle de réunion. Comme lui, c'est une
    reconstitution : il suivra le fichier vectoriel de la charte lorsqu'il
    sera fourni.
  -->
  <rect width="64" height="64" fill="#101C2C"/>
  <g transform="translate(32 32) scale(0.56) translate(-50 -50)">
  <circle cx="50" cy="50" r="45" fill="none" stroke="#A98A4C" stroke-width="2.4"/>
  <polygon fill="#A5854A"
    points="46.5,9 51.6,10.6 19.6,79.9 86.6,81.1 84.6,85 22.5,85 14.2,78.4"/>
  <polygon fill="#C09F61"
    points="51.6,10.6 57.6,12.5 26.2,77.6 30.1,75.4 88.3,77.6 86.6,81.1 19.6,79.9"/>
  </g>
</svg>
